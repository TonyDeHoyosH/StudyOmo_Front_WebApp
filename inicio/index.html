    <!-- Contenedor principal de la vista -->
    <main class="main-view">
        
        <!-- ====================================================================== -->
        <!-- COMPONENTE REUTILIZABLE: Tarjeta de Información (Info Card)            -->
        <!-- ====================================================================== -->
        <div class="info-card" id="info-card">
            
            <!-- Objeto #1: Recurso visual -->
            <div class="info-card__visual">
                <!-- Este div crea la forma de baloncesto con CSS puro -->
            </div>

            <!-- Objeto #2: Información y acción -->
            <div class="info-card__content">
                <h1 class="info-card__heading">
                    Comienza una sesión de concentración...
                </h1>
                <p class="info-card__text">
                    Haz click en el siguiente botón y crea un objetivo.
                </p>
                <!-- Objeto #3: Botón de acción -->
                <button class="btn btn--primary info-card__action">
                    Crear Objetivo
                </button>
            </div>
        </div>
        <!-- ====================================================================== -->
        <!-- FIN DEL COMPONENTE REUTILIZABLE                                        -->
